spring.application.name=customer-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bankforge}
spring.datasource.username=${DB_USERNAME:bankforge_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8084